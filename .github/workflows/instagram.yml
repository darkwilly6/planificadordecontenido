name: Instagram cada hora

# Captura historias (solo duran 24 h) y actualiza estadísticas de publicaciones recientes.
# Requiere el secreto del repositorio FIREBASE_SERVICE_ACCOUNT (JSON de la cuenta de servicio).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --prefix scripts --no-audit --no-fund
      - name: Sincronizar Instagram
        run: node scripts/ig-sync.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Zona horaria para fechar historias y publicaciones como en la app.
          TZ: America/El_Salvador
